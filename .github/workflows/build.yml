name: Build

# The steps live in build-reusable.yml, shared by every component repository, so
# a fix to the build reaches all of them instead of the one that happened to be
# edited. What stays here is only what differs between repositories.
#
# TEMPLATE-ONLY NOTE — setup.mjs replaces everything between this line and the
# next marker, because none of it is true once adopted.
#
# **Referenced locally, not at @v1, and that is the deliberate difference from
# release.yml.** A `./` reference resolves against the calling commit, so this
# runs the reusable workflow as it exists in the working tree — meaning a change
# to it is tested here, on the repository it lives in, before any tag moves it
# into fifteen other pipelines. release.yml cannot do the same because its job
# is skipped on the template entirely; build must run here, since this is the
# only CI that ever compiles the control sources every new repository is seeded
# from.
#
# `adopt-first` is true for the same reason: `__NAMESPACE__` is not a valid
# identifier, so the template adopts itself into a scratch state and builds
# that. setup.mjs drops the input along with this note.
#
# END TEMPLATE-ONLY NOTE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      adopt-first: true
