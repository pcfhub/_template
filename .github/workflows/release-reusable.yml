name: Release (reusable)

# The release pipeline, once, for every component repository.
#
# Before this, each repo carried its own ~130-line copy of these steps, and they
# had already drifted: this template's version globbed for its artifacts and
# enforced the 5 MB web-resource ceiling, while Code-Editor-PCF hard-coded two
# filenames and checked no size at all. Neither was wrong when it was written.
# The second one simply stopped receiving the fixes the first one got, which is
# what thirteen copies of a build script always do.
#
# So the differences between repositories became inputs, and everything they
# share lives here. A caller is now six lines.
#
# Referenced as:
#   uses: pcfhub/_template/.github/workflows/release-reusable.yml@v1
#
# Pinned to a tag rather than a branch, deliberately. A repository's release
# build is the last place to want an unannounced change: `@main` would mean a
# fix here going straight into thirteen production pipelines with nobody
# testing it first.

on:
  workflow_call:
    inputs:
      control-dir:
        description: 'The control directory, containing ControlManifest.Input.xml.'
        required: true
        type: string
      solution-dir:
        description: 'The solution directory, containing the .cdsproj.'
        required: true
        type: string
      tag:
        description: 'An existing tag to build, when dispatched by hand.'
        required: false
        type: string
      node-version:
        required: false
        type: string
        default: '20'
      rename-unmanaged:
        description: >-
          Rename the unmanaged solution to *_unmanaged.zip, which is what the
          hub matches by default.

          Set false for a repository whose pcfhub.json already declares the name
          msbuild produces. Renaming there would change the asset name on new
          releases while old published releases keep theirs — and the hub reads
          pcfhub.json from the default branch, not from the tag, so one set of
          patterns has to match every release the repo has ever cut.
        required: false
        type: boolean
        default: true
      bundle-max-bytes:
        description: 'Dataverse''s default web resource ceiling.'
        required: false
        type: number
        default: 5242880

jobs:
  release:
    # Windows, not Linux. The solution is packed by msbuild through
    # Microsoft.PowerApps.MSBuild.Solution, a .NET Framework toolchain — there
    # is no Linux runner that can produce the zip.
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - uses: microsoft/setup-msbuild@v2

      # The version in the control manifest is what the platform upgrades on. A
      # tag that disagrees with it produces a release the hub records under one
      # number and Dataverse installs as another, and nobody notices until an
      # upgrade silently does nothing. Solution.xml carries its own version and
      # is just as easy to forget.
      #
      # Checked before anything is installed or built, so a mismatch costs
      # seconds rather than a whole Windows pack.
      - name: Check the tag matches the manifests
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''

          $control = ([xml](Get-Content "${{ inputs.control-dir }}/ControlManifest.Input.xml")).manifest.control.version
          if ($tag -ne $control) {
            throw "Tag $tag does not match ControlManifest version $control."
          }

          $solution = ([xml](Get-Content "${{ inputs.solution-dir }}/src/Other/Solution.xml")).ImportExportXml.SolutionManifest.Version
          if ($tag -ne $solution) {
            throw "Tag $tag does not match Solution.xml version $solution."
          }

      # `npm ci` rather than `npm install`: the lockfile is what was tested, and
      # a release is the worst moment to resolve a new transitive version.
      - name: Install dependencies
        run: npm ci

      - name: Build the control
        run: npm run build

      # /restore is only needed on a cold checkout, which every CI run is.
      - name: Pack the solution
        run: msbuild /t:build /restore /p:configuration=Release
        working-directory: ${{ inputs.solution-dir }}

      # Found by glob rather than by name, so renaming the solution does not
      # quietly stop producing artifacts — which is the failure mode that
      # started this file.
      - name: Collect the artifacts
        shell: pwsh
        env:
          SOLUTION_DIR: ${{ inputs.solution-dir }}
          RENAME_UNMANAGED: ${{ inputs.rename-unmanaged }}
          BUNDLE_MAX_BYTES: ${{ inputs.bundle-max-bytes }}
        run: |
          $out = "$env:SOLUTION_DIR/bin/Release"
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $managed = Get-ChildItem "$out/*_managed.zip" | Select-Object -First 1
          if (-not $managed) { throw "No managed solution in $out." }

          $unmanaged = Get-ChildItem "$out/*.zip" |
            Where-Object { $_.Name -notlike '*_managed.zip' } |
            Select-Object -First 1
          if (-not $unmanaged) { throw "No unmanaged solution in $out." }

          Copy-Item $managed.FullName artifacts/

          # msbuild names the unmanaged zip after the *project file*, not the
          # solution's <UniqueName> — so for many repos it matches neither of
          # the hub's default globs and the unmanaged download would be empty.
          if ($env:RENAME_UNMANAGED -eq 'true') {
            Copy-Item $unmanaged.FullName ("artifacts/" + $unmanaged.BaseName + "_unmanaged.zip")
          } else {
            Copy-Item $unmanaged.FullName artifacts/
          }

          # The demo bundle is the production bundle.js under out/controls —
          # written by the pack above, not by `npm run build`. The .pcfproj sets
          # PcfBuildMode=production, so msbuild rebuilds into the same directory
          # and overwrites the earlier development output. Worth being precise
          # about: reading this the other way round suggests an unminified
          # bundle is being shipped, which would be a bug rather than the
          # current behaviour.
          #
          # A standard pcf-scripts build calls
          # window.ComponentFramework.registerControl if present, which is the
          # exact hook PCFHub's demo harness boots against — so there is nothing
          # hub-specific to build. It is attached under its own name because the
          # hub matches a demo_bundle release asset literally called bundle.js
          # by default, and attaching it costs nothing even while
          # demo.fidelity is still "none": the hub only shows the demo once
          # fidelity says to.
          $bundle = Get-ChildItem out/controls -Filter bundle.js -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "No bundle.js under out/controls after the pack." }

          # Repeated from build.yml on purpose: this is the artifact people
          # actually install, and a tag can be cut from a commit that never went
          # through build.yml at all.
          $limit = [int]$env:BUNDLE_MAX_BYTES
          if ($bundle.Length -gt $limit) {
            throw "bundle.js is $($bundle.Length) bytes, over the $limit byte Dataverse web resource limit."
          }

          # A ceiling with no runway is a ceiling you hit without warning, and
          # the thing you hit it with is a release customers cannot import.
          # Code-Editor-PCF's first run through this workflow came in at 93.6% of
          # the limit — one dependency bump from failing, on a repository whose
          # previous workflow checked the size not at all.
          #
          # 90% because a bundle rarely grows in small steps: it grows when a
          # library arrives. One release of notice is about what that buys.
          $used = [math]::Round(($bundle.Length / $limit) * 100, 1)
          if ($used -ge 90) {
            Write-Host "::warning::bundle.js is at $used% of the ${limit}-byte Dataverse web resource limit ($($bundle.Length) bytes). Trim it before it stops importing — check for a dependency that could be externalised or lazy-loaded."
          }

          Copy-Item $bundle.FullName artifacts/bundle.js

          Get-ChildItem artifacts | ForEach-Object { Write-Host "attaching $($_.Name) ($($_.Length) bytes)" }

      # `generate_release_notes` only when this is a *new* tag.
      #
      # Re-dispatching an existing tag re-runs the build against a release that
      # already has notes, and asking GitHub to generate them again appends a
      # second copy rather than replacing the first — verified the hard way on
      # Code-Editor-PCF v1.1.0, which came back with "What's Changed" and its
      # contributor list printed twice. That matters beyond looking untidy: the
      # hub imports release notes into a component's changelog, so a duplicate
      # here is a duplicate on the published page.
      #
      # `inputs.tag` is set only by workflow_dispatch, so its emptiness is
      # exactly the "first time this tag has been released" signal.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ inputs.tag == '' }}
          append_body: false
          files: artifacts/*

      # Nothing notifies PCFHub from here, on purpose. Publishing the release
      # above fires GitHub's own `release` webhook, which the hub authenticates
      # by HMAC over the raw delivery body — a curl from this workflow could not
      # produce that signature, and adding a second unauthenticated endpoint to
      # accept one would be a worse trade than the hourly sweep that already
      # backs the webhook up.
      #
      # So: configure the webhook once per repository (Settings → Webhooks,
      # payload URL https://pcfhub.dev/webhooks/github, content type
      # application/json, secret shared with the hub, events: Releases and
      # Pushes) and a tag publishes within minutes. Without it, within the hour.
      # https://pcfhub.dev/publish walks through it.
