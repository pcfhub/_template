<!DOCTYPE html>
<!--
  Every state of the view, side by side, in a real browser — for looking at
  and for `npm run shots`.

      npm run build
      npm run harness -- --no-open
      then open http://localhost:8181/dev/preview.html, or run npm run shots

  **Not the harness.** `dev/harness.html` is one control and a page of
  switches, for poking at; this page holds still, one card per state, so one
  picture shows each and a screenshot recipe can frame any card by its id.

  Each card is its own host on the dataset rig (`dev/host.js`), over the
  fixture in `dev/fixture.js` — or the hub's demo fixture with `?fixture=demo`,
  whose values are already formatted the way a form shows them, which is what
  a published picture should be of. The rig is driven until it owes nothing
  (`host.drive`), because a dataset control's mutators only take effect on the
  next fetch. A standard control draws into its card; a React (virtual) one
  returns an element, rendered into it — `setup.mjs --framework react` puts
  React and the Fluent stand-in on this page for that. The states are the
  control's own: add a card for each one worth a picture.

  Query parameters, all optional:

    ?width=720          each card's width in px, and the width the rig allocates
    ?dark=1             the rig's dark theme, on a dark ground
    ?rtl=1              right to left
    ?only=view,empty    only these cards, by id
    ?fixture=demo       demo/records.json instead of dev/fixture.js
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>__TITLE__ — preview</title>
    <link rel="stylesheet" href="../out/controls/__CONTROL__/css/__CONTROL__.css" />
    <style>
        /* The host page: a form's ground and padding, nothing of the control. */
        body {
            margin: 0;
            padding: 24px;
            background: #f0f0f0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        body.is-dark {
            background: #0a0a0a;
            color: #ffffff;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-start;
        }
        .card {
            box-sizing: border-box;
            padding: 16px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
        }
        .is-dark .card {
            background: #292929;
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            color: #616161;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .is-dark .card h2 {
            color: #adadad;
        }
        #status:empty {
            display: none;
        }
    </style>
</head>
<body>
    <p id="status"></p>
    <div class="grid" id="grid"></div>

    <script src="fixture.js"></script>
    <script src="host.js"></script>
    <script>
        (function () {
            'use strict';

            var host = window.__pcfHost;

            // The bundle registers itself the moment it runs; this is where it lands.
            var registration = host.captureRegistration(window);

            /*
             * The control's own inputs, as a form hands them over — every
             * declared input, `null` where the maker set none. The scaffold's
             * only one is the page size, left unset so the control adopts the
             * host's.
             */
            var INPUTS = { pageSize: null };

            /*
             * One card per state worth a picture: an id (what a shots recipe
             * frames), a title, and the rig options that make the state. These
             * are the scaffold's; a control adds its own.
             */
            var STATES = [
                { id: 'view', title: 'The view', options: {} },
                { id: 'empty', title: 'An empty view', options: { records: [] } },
                { id: 'loading', title: 'Loading', options: { loading: true } },
                { id: 'error', title: 'The view failed to load', options: { error: true } },
                { id: 'canvas', title: 'In a canvas app', options: { host: 'canvas' } },
            ];

            var params = new URLSearchParams(window.location.search);
            var width = Number(params.get('width')) || 720;
            var dark = params.get('dark') === '1';
            var rtl = params.get('rtl') === '1';
            var only = (params.get('only') || '').split(',').filter(Boolean);
            var status = document.getElementById('status');

            document.body.classList.toggle('is-dark', dark);

            /* The 1033 .resx's text where it has a key, as the platform would; the rig's own table otherwise. */
            var strings = null;

            function loadStrings() {
                return fetch('../__CONTROL__/strings/__CONTROL__.1033.resx')
                    .then(function (response) {
                        return response.ok ? response.text() : '';
                    })
                    .then(function (xml) {
                        if (!xml) {
                            return;
                        }

                        strings = {};
                        new DOMParser().parseFromString(xml, 'application/xml').querySelectorAll('data').forEach(function (node) {
                            strings[node.getAttribute('name')] = node.querySelector('value').textContent;
                        });
                    })
                    .catch(function () {
                        // Served from file:// — the rig's own strings stand in.
                    });
            }

            function loadFixture() {
                if (params.get('fixture') !== 'demo') {
                    return Promise.resolve(window.__pcfFixture);
                }

                return fetch('../demo/records.json').then(function (response) {
                    return response.json();
                });
            }

            function mount(fixture, state) {
                var card = document.createElement('section');
                var heading = document.createElement('h2');
                var container = document.createElement('div');

                card.className = 'card';
                card.id = state.id;
                card.style.width = width + 'px';
                card.dir = rtl ? 'rtl' : 'ltr';
                heading.textContent = state.title;
                card.append(heading, container);
                document.getElementById('grid').append(card);

                var options = Object.assign({
                    width: width - 32,
                    dark: dark,
                    rtl: rtl,
                    inputs: INPUTS,
                }, state.options);

                if (strings) {
                    options.getString = function (key) {
                        return strings[key] !== undefined ? strings[key] : key;
                    };
                }

                var handle = host.createHost(fixture, options);
                var instance = new registration.ctor();
                var painting = false;

                /*
                 * Paint through `drive`, not one `updateView`: the control's
                 * mutators (a page size, a filter) take effect on the next
                 * fetch, and `drive` runs the passes a platform would.
                 */
                function paint() {
                    // `notifyOutputChanged` can fire during a pass, and a re-entrant paint would recurse.
                    if (painting) {
                        return;
                    }

                    painting = true;

                    try {
                        var driven = host.drive(instance, handle, 10);
                        var ReactDOM = window.__harnessReactDOM || window.ReactDOM;

                        // A virtual control returns an element rather than drawing into a container.
                        if (driven.element !== undefined && driven.element !== null && ReactDOM) {
                            ReactDOM.render(driven.element, container);
                        }
                    } finally {
                        painting = false;
                    }
                }

                instance.init(handle.context, function () {
                    setTimeout(paint, 0);
                }, {}, container);
                paint();
            }

            window.__harnessStart = function () {
                if (typeof registration.ctor !== 'function') {
                    status.textContent = 'The bundle registered no control. Run npm run build.';

                    return;
                }

                Promise.all([loadStrings(), loadFixture()]).then(function (loaded) {
                    STATES.filter(function (state) {
                        return only.length === 0 || only.indexOf(state.id) !== -1;
                    }).forEach(function (state) {
                        mount(loaded[1], state);
                    });
                });
            };
        })();
    </script>

    <script src="../out/controls/__CONTROL__/bundle.js"></script>
    <script>
        window.__harnessStart();
    </script>
</body>
</html>
